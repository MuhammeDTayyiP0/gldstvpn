<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
  <title>GeldeSat VPN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/index.css">
</head>
<body>
  <!-- Title Bar -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-title">
      <svg class="titlebar-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7V12C2 17.5 6.84 22.74 12 24C17.16 22.74 22 17.5 22 12V7L12 2Z" fill="url(#shieldGrad)" opacity="0.9"/>
        <path d="M12 2L2 7V12C2 17.5 6.84 22.74 12 24C17.16 22.74 22 17.5 22 12V7L12 2Z" stroke="url(#shieldStroke)" stroke-width="0.5" fill="none"/>
        <path d="M9 12L11 14L15 10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="shieldGrad" x1="2" y1="2" x2="22" y2="24">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
          </linearGradient>
          <linearGradient id="shieldStroke" x1="2" y1="2" x2="22" y2="24">
            <stop offset="0%" stop-color="#818cf8"/>
            <stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
        </defs>
      </svg>
      <span>GeldeSat VPN</span>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn minimize" id="btn-minimize" title="Küçült">
        <svg viewBox="0 0 12 12"><rect y="5" width="12" height="2" rx="1" fill="currentColor"/></svg>
      </button>
      <button class="titlebar-btn close" id="btn-close" title="Kapat">
        <svg viewBox="0 0 12 12">
          <path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="app-container">
    <!-- Connection Visual -->
    <div class="connection-visual">
      <div class="globe-container" id="globe-container">
        <div class="globe-ring ring-1"></div>
        <div class="globe-ring ring-2"></div>
        <div class="globe-ring ring-3"></div>
        <div class="globe-core" id="globe-core">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
            <ellipse cx="32" cy="32" rx="16" ry="28" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
            <ellipse cx="32" cy="32" rx="28" ry="16" stroke="currentColor" stroke-width="1.5" opacity="0.3" transform="rotate(0 32 32)"/>
            <path d="M4 32H60" stroke="currentColor" stroke-width="1" opacity="0.2"/>
            <path d="M32 4V60" stroke="currentColor" stroke-width="1" opacity="0.2"/>
          </svg>
        </div>
        <div class="pulse-ring" id="pulse-ring"></div>
      </div>

      <!-- Status Text -->
      <div class="status-section">
        <div class="status-indicator" id="status-indicator">
          <div class="status-dot" id="status-dot"></div>
          <span class="status-text" id="status-text">Bağlantı Kesildi</span>
        </div>
        <div class="connection-time" id="connection-time" style="display: none;">
          <svg viewBox="0 0 16 16" fill="none" class="time-icon">
            <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 5V8L10 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span id="time-display">00:00:00</span>
        </div>
      </div>
    </div>

    <!-- Connect Button -->
    <div class="connect-section">
      <button class="connect-btn" id="connect-btn">
        <div class="connect-btn-bg"></div>
        <div class="connect-btn-content">
          <svg class="power-icon" viewBox="0 0 32 32" fill="none" id="power-icon">
            <path d="M16 4V16" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M8.93 8.93A10 10 0 1 0 23.07 8.93" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="connect-btn-ring"></div>
      </button>
      <span class="connect-label" id="connect-label">Bağlanmak için dokunun</span>
    </div>

    <!-- Server Info -->
    <div class="server-card" id="server-card">
      <div class="server-card-header">
        <svg viewBox="0 0 20 20" fill="none" class="server-icon">
          <rect x="2" y="3" width="16" height="6" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <rect x="2" y="11" width="16" height="6" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="6" cy="6" r="1" fill="currentColor"/>
          <circle cx="6" cy="14" r="1" fill="currentColor"/>
          <line x1="10" y1="5" x2="14" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="10" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="10" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="10" y1="15" x2="12" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Sunucu Bilgisi</span>
      </div>
      <div class="server-card-body">
        <div class="info-row">
          <span class="info-label">Sunucu</span>
          <span class="info-value">vpn.geldesat.com</span>
        </div>
        <div class="info-row">
          <span class="info-label">Port</span>
          <span class="info-value">443</span>
        </div>
        <div class="info-row">
          <span class="info-label">Protokol</span>
          <span class="info-value protocol-badge">VLESS</span>
        </div>
        <div class="info-row">
          <span class="info-label">Ağ</span>
          <span class="info-value">WebSocket</span>
        </div>
        <div class="info-row">
          <span class="info-label">Güvenlik</span>
          <span class="info-value security-badge">
            <svg viewBox="0 0 12 12" fill="none" class="lock-icon">
              <rect x="2.5" y="5" width="7" height="5.5" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
              <path d="M4.5 5V3.5a1.5 1.5 0 0 1 3 0V5" stroke="currentColor" stroke-width="1.2"/>
            </svg>
            TLS
          </span>
        </div>
      </div>
    </div>

    <!-- Error Message -->
    <div class="error-container" id="error-container" style="display: none;">
      <div class="error-message">
        <svg viewBox="0 0 20 20" fill="none" class="error-icon">
          <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 6V11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="10" cy="14" r="1" fill="currentColor"/>
        </svg>
        <span id="error-text">Hata oluştu</span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
