<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
  <title>V204 VPN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/index.css">
</head>

<body>
  <!-- Screen Flash Overlay -->
  <div class="screen-flash" id="screen-flash"></div>

  <!-- Title Bar -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-title">
      <img src="../../resources/icon.png" class="titlebar-icon-img" alt="Logo">
      <span>V204 VPN</span>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn id-minimize" id="btn-minimize" title="Küçült">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4" />
        </svg>
      </button>
      <button class="titlebar-btn id-profile" id="btn-profile" title="Profil & Kullanım">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </button>
      <button class="titlebar-btn id-close" id="btn-close" title="Kapat">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="app-container">
    <!-- Particles Container -->
    <div class="particles-container" id="particles-container"></div>

    <!-- Connection Visual -->
    <div class="connection-visual">
      <div class="globe-container" id="globe-container">
        <div class="globe-ring ring-1"></div>
        <div class="globe-ring ring-2"></div>
        <div class="globe-ring ring-3"></div>

        <!-- Holographic HUD Elements -->
        <div class="hud-ring hud-ring-1"></div>
        <div class="hud-ring hud-ring-2"></div>
        <div class="hud-scan-line"></div>
        <div class="hud-circle-points"></div>

        <div class="globe-core" id="globe-core">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="1.5" opacity="0.3" />
            <ellipse cx="32" cy="32" rx="16" ry="28" stroke="currentColor" stroke-width="1.5" opacity="0.3" />
            <ellipse cx="32" cy="32" rx="28" ry="16" stroke="currentColor" stroke-width="1.5" opacity="0.3"
              transform="rotate(0 32 32)" />
            <path d="M4 32H60" stroke="currentColor" stroke-width="1" opacity="0.2" />
            <path d="M32 4V60" stroke="currentColor" stroke-width="1" opacity="0.2" />
          </svg>
        </div>
        <div class="pulse-ring" id="pulse-ring"></div>
      </div>

      <!-- Status Text -->
      <div class="status-section">
        <div class="status-indicator" id="status-indicator">
          <div class="status-dot" id="status-dot"></div>
          <span class="status-text" id="status-text">Bağlantı Kesildi</span>
        </div>
        <div class="connection-time" id="connection-time" style="display: none;">
          <svg viewBox="0 0 16 16" fill="none" class="time-icon">
            <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5" />
            <path d="M8 5V8L10 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <span id="time-display">00:00:00</span>
        </div>

        <!-- Speed & Data Stats -->
        <div class="stats-grid" id="stats-grid" style="display: none;">
          <div class="stat-box">
            <div class="stat-header">
              <svg viewBox="0 0 24 24" fill="none" class="stat-icon-down">
                <path d="M12 5V19M12 19L5 12M12 19L19 12" stroke="currentColor" stroke-width="2.5"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span>Download</span>
            </div>
            <div class="stat-value" id="download-speed">0.00 KB/s</div>
          </div>

          <div class="stat-box">
            <div class="stat-header">
              <svg viewBox="0 0 24 24" fill="none" class="stat-icon-up">
                <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
              <span>Upload</span>
            </div>
            <div class="stat-value" id="upload-speed">0.00 KB/s</div>
          </div>

          <div class="stat-box total-box">
            <div class="stat-header">
              <svg viewBox="0 0 24 24" fill="none" class="stat-icon-total">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
                <path d="M12 7V12L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
              <span>Toplam Veri</span>
            </div>
            <div class="stat-value" id="total-usage">0.00 MB</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Connect Button -->
    <div class="connect-section">
      <div class="connect-btn-wrapper" id="connect-btn-wrapper">
        <div class="ripple-container" id="ripple-container"></div>
        <div class="shockwave" id="shockwave"></div>
        <div class="success-burst" id="success-burst"></div>
        <div class="disconnect-burst" id="disconnect-burst"></div>
        <button class="connect-btn" id="connect-btn">
          <div class="connect-btn-content">
            <svg class="power-icon" viewBox="0 0 32 32" fill="none" id="power-icon">
              <path d="M16 4V16" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
              <path d="M8.93 8.93A10 10 0 1 0 23.07 8.93" stroke="currentColor" stroke-width="3"
                stroke-linecap="round" />
            </svg>
          </div>
        </button>
        <div class="connect-outer-ring"></div>
        <div class="connect-outer-ring-2"></div>
        <div class="connect-spinner-ring" id="spinner-ring"></div>
        <div class="radar-sweep" id="radar-sweep"></div>
      </div>
      <span class="connect-label" id="connect-label">Bağlanmak için dokunun</span>
    </div>

    <!-- Aurora / Nebula Background Layers -->
    <div class="aurora-layer aurora-1"></div>
    <div class="aurora-layer aurora-2"></div>
    <div class="aurora-layer aurora-3"></div>
    <div class="nebula-layer nebula-1"></div>
    <div class="nebula-layer nebula-2"></div>
    <div class="noise-overlay"></div>

    <!-- Decorative Background Elements -->
    <div class="decor-glow-1"></div>
    <div class="decor-glow-2"></div>
    <div class="decor-glow-3"></div>
    <div class="decor-glow-4"></div>
    <div class="decor-glow-5"></div>

    <!-- Error Message -->
    <div class="error-container" id="error-container" style="display: none;">
      <div class="error-message">
        <svg viewBox="0 0 20 20" fill="none" class="error-icon">
          <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5" />
          <path d="M10 6V11" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <circle cx="10" cy="14" r="1" fill="currentColor" />
        </svg>
        <span id="error-text">Hata oluştu</span>
      </div>
    </div>

    <!-- Usage Stats Modal -->
    <div class="profile-modal-overlay" id="profile-modal">
      <div class="profile-modal-content">
        <div class="profile-header">
          <div>
            <h2>Hesabım</h2>
            <span class="user-role">Premium Üye</span>
          </div>
          <button class="icon-btn close-btn" id="btn-close-profile">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="user-profile-summary">
          <div class="avatar-circle">M</div>
          <div class="user-details-box">
            <span class="username">MTE Kullanıcısı</span>
            <span class="user-id">ID: 8842-9912</span>
            <div class="user-status-badge">Aktif</div>
          </div>
        </div>

        <div class="usage-stats-section">
          <h3>Kullanım İstatistikleri</h3>
          <div class="usage-grid-layout">
            <div class="usage-card-item">
              <span class="time-label">Bugün</span>
              <span class="data-value" id="usage-day">--</span>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 15%"></div>
              </div>
            </div>
            <div class="usage-card-item">
              <span class="time-label">Bu Hafta</span>
              <span class="data-value" id="usage-week">--</span>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 45%"></div>
              </div>
            </div>
            <div class="usage-card-item">
              <span class="time-label">Bu Ay</span>
              <span class="data-value" id="usage-month">--</span>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 70%"></div>
              </div>
            </div>
            <div class="usage-card-item highlight-card">
              <span class="time-label">Tüm Zamanlar</span>
              <span class="data-value" id="usage-all">--</span>
              <div class="progress-bar">
                <div class="progress-fill" style="width: 100%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-credit">made by MTE.</div>
  </div>

  <script src="app.js"></script>
</body>

</html>
