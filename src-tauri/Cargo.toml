[package]
name = "v204-vpn"
version = "3.0.0"
description = "V204 VPN - Ultra Premium VLESS Client"
authors = ["GeldeSat"]
edition = "2021"
rust-version = "1.70"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["system-tray", "window-all", "path-all", "fs-all", "shell-execute", "shell-open", "protocol-asset"] }
webkit2gtk = { version = "0.18", features = ["v4_1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
# For Xray process management
os_pipe = "1.1"
shared_child = "1.0"
