[package]
name = "v204-vpn"
version = "3.1.0"
description = "V204 VPN - Ultra Premium VLESS Client"
authors = ["GeldeSat"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-process = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
# For Xray process management
os_pipe = "1.1"
shared_child = "1.0"
